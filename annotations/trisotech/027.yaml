          path: "AI -> rule -> human"
          human_gate: true
          evidence: image
    authority:
      invokes_without_gate: 0
      mutates: none
    guards: []
    notes: "Both slides are variants of one process (same AI task, same data); coded widest. Demo 5 gateway approves/rejects on the AI score with no human; Demo 4's conditional human review is absent there, so no guard coded."
