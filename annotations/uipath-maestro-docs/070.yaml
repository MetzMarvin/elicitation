artefact: uipath-maestro-docs/070
annotated: 2026-10-06
annotatable: true
chains:
  - id: C1
    ai_elements: 4
    structure: fixed-sequence
    function:
      description: "Agents validate a new CRM contact, research the company and summarise the contact in parallel, then score the lead; gateways route to opportunity creation or nurturing."
      operations: [classify, summarise, generate, decide]
      autonomy: decides
    reads_untrusted:
      - writer: unknown
        evidence: not-visible
    reads_sensitive:
      - kind: customer-pii
        evidence: image
    output:
      shape: free-text
      sinks:
        - audience: control-flow
          path: "AI -> gateway"
          human_gate: false
          evidence: image
        - audience: internal-system
          path: "AI -> gateway -> system"
          human_gate: false
          evidence: image
        - audience: internal-human
          path: "AI -> gateway -> human"
          human_gate: false
          evidence: image
    authority:
      invokes_without_gate: 1
      mutates: internal-records
    guards: [error-path-to-human]
    notes: "Four agent tasks, no visible tools. Ungated non-AI calls: one CRM write per score branch. Error boundary on the validation agent leads to the human curation task."
open_questions: []
