      shape: structured
      sinks:
        - audience: control-flow
          path: "AI -> gateway"
          human_gate: false
          evidence: image
        - audience: internal-system
          path: "AI -> system"
          human_gate: false
          evidence: record
    authority:
      invokes_without_gate: 0
      mutates: none
    guards: []
    notes: "Both images are versions of one process (linear, then gateway variant); coded the wider gateway variant. Rocket-icon tasks are AI per page prose (service type AI). No non-AI service calls; outputs end in process variables."
