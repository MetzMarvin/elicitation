      invokes_without_gate: 5
      mutates: internal-records
    guards: [human-review]
    notes: "Ungated: OpenMemory, Filesystem (read/list ops only), Deepwiki (remote MCP, external responses fed back), Time, script tool = 5. Filesystem writes need user confirmation; the message event sub-process injects content of unknown origin."
