chains:
  - id: C1
    ai_elements: 2
    structure: fixed-sequence
    function:
      description: "loan application: after rule-based risk scoring and a KYC sub-process, an AI routing task assigns low / medium / high risk; low and high branches run automatically (accept or reject email plus issue-policy or reject-application service task), the medium branch has a second AI task summarise the results for a human investigator, whose risk assessment then routes to the low or high branch; a collapsed sentiment-analysis sub-process follows on both outcomes"
      operations: [classify, summarise]
      autonomy: decides
    reads_untrusted:
      - writer: outsider-writable
        evidence: inferred
      - writer: system-generated
        evidence: image
    reads_sensitive:
      - kind: customer-pii
        evidence: inferred
      - kind: unknown
        evidence: not-visible
    output:
      shape: free-text
      sinks:
        - audience: control-flow
          path: "outsider -> system -> AI -> gateway -> system"
          human_gate: false
          evidence: image
        - audience: internal-system
          path: "outsider -> system -> AI -> gateway -> system"
          human_gate: false
          evidence: image
        - audience: external-recipient
          path: "outsider -> system -> AI -> gateway -> system -> external"
          human_gate: false
          evidence: inferred
        - audience: internal-human
          path: "outsider -> system -> AI -> gateway -> AI -> human"
          human_gate: true
          evidence: image
    authority:
      invokes_without_gate: 2
      mutates: internal-records
    guards: [human-review]
    notes: "AI tasks marked by the OpenAI icon: routing (feeds the risk gateway) and summary (medium branch, feeds a user task). Gear service tasks, email tasks and the collapsed sentiment-analysis sub-process not counted as AI. Ungated calls: email plus issue/reject service task, 2. Human review only on the medium branch, reached at the AI's choice."
