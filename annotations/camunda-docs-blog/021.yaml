artefact: camunda-docs-blog/021
annotated: 2026-09-30
annotatable: true
chains:
  - id: C1
    ai_elements: 1
    structure: agent-loop
    function:
      description: "claim handling: an AI agent asks the insurer for missing information, consolidates the claim and evaluates it against policy rules; documentation and an insurer notification follow, with an escalation path to a human."
      operations: [generate, summarise, decide, plan-act]
      autonomy: acts
    reads_untrusted:
      - writer: outsider-writable
        evidence: image
      - writer: system-generated
        evidence: image
    reads_sensitive:
      - kind: customer-pii
        evidence: image
      - kind: unknown
        evidence: not-visible
    output:
      shape: free-text
      sinks:
        - audience: external-recipient
          path: "outsider -> system -> AI -> external -> AI"
          human_gate: false
          evidence: image
        - audience: internal-system
          path: "outsider -> system -> AI -> system"
          human_gate: false
          evidence: image
        - audience: external-recipient
          path: "outsider -> system -> AI -> system -> external"
          human_gate: false
          evidence: image
        - audience: internal-human
          path: "outsider -> system -> AI -> human -> system -> external"
          human_gate: false
          evidence: image
    authority:
      invokes_without_gate: 5
      mutates: internal-records
    guards: [error-path-to-human]
    notes: "AI element is the ad-hoc sub-process 'Process claim (AI agent)'. Ungated: three agent tools (clarification message, consolidate, DMN evaluation) plus documentation and notification, 5. Insurer replies feed back into the agent; escalation boundary to a human coded as error path."
